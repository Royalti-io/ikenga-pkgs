<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Outbound</title>
    <!-- No <link rel="stylesheet">: WebKitGTK can't load subresources (link/
         fetch/img) from the about:srcdoc document the shell mounts — only
         inlined scripts work. So outbound.css ships as a JS string
         (lib/outbound-css.js) and app.js injects it as an inline <style>.
         The block below is just the boot/token shim. -->
    <style>
      :root {
        --ob-bg: var(--bg-base, #fff);
        --ob-fg: var(--fg, #111);
        --ob-muted: var(--fg-muted, #666);
        --ob-danger: var(--danger, #c44);
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      }
      * { box-sizing: border-box; }
      /* The page itself never scrolls — only the inner list/calendar does. */
      html, body, #root { height: 100%; overflow: hidden; }
      /* Higher specificity than app-kit-css 00-base body reset (same pattern as tasks). */
      html body { margin: 0; background: var(--ob-bg); color: var(--ob-fg); font: 14px/1.4 var(--font-sans, system-ui); -webkit-font-smoothing: antialiased; }
      #root > .boot { padding: 1rem 1.25rem; font-size: 0.85rem; color: var(--ob-muted); }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Loading…</div></div>
    <!--
      Same bootstrap pattern as tasks/mail: pkg_content/mod.rs inlines
      `<script src="./x">` into the srcdoc HTML; the resulting inline module
      is rooted at `about:srcdoc`, so static `import './foo.js'` fails with
      "does not resolve to a valid URL". Resolve against document.baseURI
      (which reflects the host-injected <base href>) → a real URL the module
      loader accepts. Once app.js is loaded as a fetched file its OWN URL is
      real and relative imports inside it work normally.
    -->
    <script type="module">
      try {
        await import(new URL('app.js', document.baseURI).href);
      } catch (e) {
        const root = document.getElementById('root');
        root.innerHTML = `<div class="boot" style="color:var(--ob-danger)">Failed to load app.js: ${e.message ?? e}</div>`;
        throw e;
      }
    </script>
  </body>
</html>
