<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hard cut</title>
  <style>
    :root {
      --p-duration_ms: 0;
      --p-easing: ease-in-out;
      --accent: #6366f1;
    }
    html, body { margin: 0; height: 100%; }
    /* HF reads data-duration (ms) off .scene to time the composition. */
    .scene {
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.5rem; background: #0b0b0f; color: #f5f5f7;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      text-align: center; padding: 6vh 6vw; box-sizing: border-box;
    }
    .scene h1 { font-size: clamp(2rem, 6vw, 4.5rem); margin: 0; color: var(--accent); }
    .params { display: flex; flex-direction: column; gap: .5rem; opacity: .9; }
    .param { font-size: clamp(1rem, 2.4vw, 1.6rem); }
  </style>
</head>
<body>
  <!-- data-duration drives scene length in ms; bindings replace {{...}} at instantiate time. -->
  <main class="scene" data-duration="0">
    <h1>Hard cut</h1>
    <div class="params">
      <div class="param" data-param="duration_ms">{{duration_ms}}</div>
      <div class="param" data-param="easing">{{easing}}</div>
    </div>
  </main>
</body>
</html>
