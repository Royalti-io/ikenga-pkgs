<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP vendored locally — the studio HF adapter declares
         requires_network:false, and copy-on-instantiate moves this file
         beside index.html into the project cell, so it must live here. -->
    <script src="gsap.min.js"></script>
    <title>Pattern-break hook</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0b0b0f;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f5f5f7;
      }
      #root { position: relative; width: 1920px; height: 1080px; }
      .clip { position: absolute; inset: 0; }
      .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 40px; text-align: center; padding: 140px;
      }
      .kicker {
        font-size: 30px; letter-spacing: .35em; text-transform: uppercase;
        color: #6366f1; opacity: .9;
      }
      h1 { font-size: 120px; line-height: 1.02; color: #f5f5f7; max-width: 1500px; }
      h1 .accent { color: #6366f1; }
      .lead { font-size: 46px; opacity: .85; max-width: 1300px; line-height: 1.3; }
      .pill {
        display: inline-block; font-size: 40px; padding: 22px 56px;
        border-radius: 999px; background: #6366f1; color: #fff; font-weight: 600;
      }
      .stat { font-size: 280px; font-weight: 800; color: #6366f1; line-height: 1; }
      .list { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
      .row { display: flex; align-items: center; gap: 28px; font-size: 44px; }
      .dot { width: 26px; height: 26px; border-radius: 50%; background: #6366f1; flex: 0 0 auto; }
      .swatches { display: flex; gap: 28px; }
      .swatch { width: 120px; height: 120px; border-radius: 18px; }
      .avatar { width: 220px; height: 220px; border-radius: 50%; background: #1c1c24; border: 8px solid #6366f1; }
      .frame { width: 1240px; height: 560px; border-radius: 24px; border: 6px solid #6366f1; background: #14141c; display: flex; align-items: center; justify-content: center; font-size: 40px; opacity: .9; }
      .barwrap { width: 1240px; height: 14px; border-radius: 999px; background: #1c1c24; overflow: hidden; }
      .bar { height: 100%; width: 0; background: #6366f1; }
      .role { font-size: 30px; letter-spacing: .2em; text-transform: uppercase; opacity: .55; }
      .url { font-size: 40px; opacity: .8; }
      .lower-third {
        position: absolute; left: 120px; bottom: 160px; right: 120px;
        background: rgba(20,20,28,.85); border-left: 10px solid #6366f1;
        padding: 40px 56px; text-align: left; border-radius: 8px;
      }
      .lt-title { font-size: 56px; color: #6366f1; margin-bottom: 14px; }
      .lt-body { font-size: 40px; opacity: .85; }
      .stages { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; max-width: 1500px; }
      .stage-chip { font-size: 36px; padding: 18px 36px; border: 3px solid #6366f1; border-radius: 12px; opacity: .9; }
    </style>
  </head>
  <body>
    <!-- Root composition: landscape 1920×1080. data-duration is in SECONDS. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <div class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div class="stage">
        <div class="kicker">Pattern-break hook</div>
        <h1 id="hero"><span class="p" data-param="claim">{{claim}}</span></h1>
        </div>
      </div>
    </div>
    <script>
      // The capture engine reads window.__timelines["main"] synchronously
      // after load — build paused, finite repeats only (no Infinity).
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".kicker", { opacity: 0, y: -30, duration: 0.6, ease: "power2.out" }, 0);
      tl.from("#hero", { opacity: 0, scale: 0.9, y: 40, duration: 0.9, ease: "back.out(1.6)" }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
