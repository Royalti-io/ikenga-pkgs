<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Suite</title>
    <style>
      :root {
        --suite-bg: var(--color-background-primary, #fff);
        --suite-fg: var(--color-text-primary, #111);
        --suite-muted: var(--color-text-secondary, #666);
        --suite-border: var(--color-border-primary, #e5e5e5);
        --suite-hover: rgba(127,127,127,0.08);
        --suite-danger: var(--color-text-danger, #c44);
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      }
      html[data-theme='dark'] :root {
        --suite-hover: rgba(255,255,255,0.06);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--suite-bg); color: var(--suite-fg); font: 14px/1.4 var(--font-sans, system-ui); }
      #root { min-height: 100vh; }
      #root > .boot { padding: 1rem 1.25rem; font-size: 0.85rem; color: var(--suite-muted); }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">Loading…</div></div>
    <!--
      Why this looks indirect: pkg_content/mod.rs inlines `<script src="./x">`
      into the srcdoc HTML to work around a WebKitGTK subresource-from-srcdoc
      bug. But the resulting inline module is rooted at `about:srcdoc`, so its
      static `import './foo.js'` and even `import('./foo.js')` fail with
      "does not resolve to a valid URL". Resolving against `document.baseURI`
      (which reflects the host-injected `<base href>`) gives a real URL the
      module loader accepts. Once app.js is loaded as a fetched file, its
      OWN url is real and relative imports inside it work normally.
    -->
    <script type="module">
      try {
        await import(new URL('app.js', document.baseURI).href);
      } catch (e) {
        const root = document.getElementById('root');
        root.innerHTML = `<div class="boot" style="color:var(--suite-danger)">Failed to load app.js: ${e.message ?? e}</div>`;
        throw e;
      }
    </script>
  </body>
</html>
