name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # @ikenga/studio-mcp bundles via `bun build` (see packages/apps/studio/mcp/build.sh).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Drift guard: a committed dist/ artifact that doesn't match a fresh build
      # fails CI. Catches the hand-vendored CSS-string drift the tasks build
      # (scripts/build.mjs) was added to kill — and applies to every pkg.
      - run: git diff --exit-code

      - run: pnpm -r test --if-present
