packages:
  - "packages/*/*"
  # com.ikenga.studio is a multi-pkg app: its shared Zod schema lives one level
  # deeper than the standard `packages/<group>/<pkg>` layout, so it needs an
  # explicit glob entry to be linked into the workspace.
  - "packages/apps/studio/*"
  # com.ikenga.git's UI iframe (ui/) is its own vite-built sub-package, same
  # depth reason as studio/* above (WP-06). sidecar/ and mcp/ are deliberately
  # NOT workspace members (they hoist deps from the parent @ikenga/pkg-git
  # package instead — see their package.json descriptions).
  - "packages/apps/git/ui"
